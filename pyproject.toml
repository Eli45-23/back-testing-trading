[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spy-research"
version = "0.1.0"
description = "Research foundation for objectively testing SPY trading ideas."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.8,<5",
    "httpx>=0.27,<1",
    "pyarrow>=18,<27",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "PyYAML>=6.0.2,<7",
]

[project.scripts]
spy-research = "spy_research.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
