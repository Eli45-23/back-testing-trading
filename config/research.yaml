research:
  version: "phase1-v1"

symbol: "SPY"

data:
  source: "alpaca"
  feed: "sip"
  timeframe: "1Min"
  adjustment: "raw"

session:
  timezone: "America/New_York"
  indicator_mode: "RTH_ONLY"
  rth_start: "09:30"
  rth_end: "16:00"

bars:
  research_timeframe: "5Min"

ema:
  fast: 9
  slow: 20

vwap:
  reset: "daily"
  session: "RTH"
  price_source: "hlc3"

atr:
  length: 14
  method: "wilder"

outcomes:
  # Unresolved Phase 1 assumptions; retain for evaluation until confirmed.
  horizons_minutes:
    - 5
    - 15
    - 30
    - 60
  include_eod: true

database:
  engine: "sqlite"

break_and_hold:
  enabled: true
  opening_range_minutes: 5
  require_close_outside_level_for_first_hold: true
  strong_hold_confirmation_closes: 2
  allow_multiple_same_direction_events: true
  allow_opposite_direction_same_day: true
  preserve_failed_breaks: true
  preserve_reclaims: true
